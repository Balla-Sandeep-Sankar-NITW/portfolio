<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231558e8'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* =============================================================
   DESIGN TOKENS  (change colours here)
   ============================================================= */
:root{
  --bg:#ffffff;
  --bg-soft:#f5f7fb;
  --surface:#ffffff;
  --text:#0f172a;
  --muted:#5a6478;
  --border:#e4e8f0;
  --accent:#1558e8;
  --accent-hover:#0f46c0;
  --accent-soft:#eef3fd;
  --accent-ink:#ffffff;
  --shadow:0 18px 40px -18px rgba(15,23,42,.25);
  --radius:14px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --hand:'Caveat','Segoe Print','Bradley Hand',cursive;
}
:root[data-theme="dark"]{
  --bg:#0b1020;
  --bg-soft:#111a30;
  --surface:#121b33;
  --text:#e9eefb;
  --muted:#9aa6c0;
  --border:#232e4d;
  --accent:#4d88ff;
  --accent-hover:#6b9bff;
  --accent-soft:#16223f;
  --accent-ink:#0b1020;
  --shadow:0 18px 40px -18px rgba(0,0,0,.6);
}

/* =============================================================
   BASE
   ============================================================= */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img,svg{display:block;max-width:100%}
ul{list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.container{width:100%;max-width:1200px;margin:0 auto;padding:0 32px}
.accent{color:var(--accent)}
.icon{width:1em;height:1em;flex:none}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 26px;border-radius:8px;font-weight:600;font-size:15px;border:1px solid transparent;transition:background .2s,border-color .2s,transform .2s}
.btn .icon{font-size:17px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-outline{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{height:40px;padding:0 22px;font-size:14px}

/* Eyebrow + headings */
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--accent);margin-bottom:14px}
.h1{font-size:clamp(32px,3.7vw,46px);line-height:1.1;font-weight:800;letter-spacing:-.025em}
.lead{color:var(--muted);font-size:16px;max-width:560px}

/* =============================================================
   NAVBAR
   ============================================================= */
.nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid transparent;transition:border-color .2s}
.nav.scrolled{border-color:var(--border)}
.nav-inner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:76px}
.logo{font-size:30px;font-weight:700;color:var(--accent);line-height:1;letter-spacing:-.02em}
.nav-links{display:flex;gap:44px}
.nav-links a{position:relative;font-size:14.5px;font-weight:500;padding:8px 0;color:var(--text);opacity:.85;transition:color .2s,opacity .2s}
.nav-links a:hover{color:var(--accent);opacity:1}
.nav-links a.active{opacity:1;font-weight:600}
.nav-links a.active::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;background:var(--accent)}
.nav-actions{display:flex;align-items:center;justify-content:flex-end;gap:18px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;font-size:20px;color:var(--text);transition:background .2s}
.icon-btn:hover{background:var(--bg-soft)}
.burger{display:none}

/* =============================================================
   PAGE WRAPPER
   ============================================================= */
.page{animation:pageIn .4s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.section{padding-top:56px;padding-bottom:88px}

/* =============================================================
   HOME
   ============================================================= */
.hero{display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:24px;min-height:calc(100vh - 76px - 90px);min-height:min(680px,calc(100vh - 170px));padding-top:24px;padding-bottom:40px}
.hello{font-size:20px;color:var(--text);opacity:.85;margin-bottom:6px}
.name{font-size:clamp(34px,5.6vw,72px);white-space:nowrap;line-height:1.02;font-weight:800;letter-spacing:-.035em;margin-bottom:22px}
.headline{font-size:clamp(26px,3.3vw,44px);line-height:1.12;font-weight:800;letter-spacing:-.025em;margin-bottom:26px}
.hero .lead{margin-bottom:34px;max-width:540px}
.hero-btns{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:34px}
.socials{display:flex;gap:26px}
.socials a{font-size:24px;color:var(--text);opacity:.8;transition:color .2s,opacity .2s,transform .2s}
.socials a:hover{color:var(--accent);opacity:1;transform:translateY(-2px)}

.hero-photo{position:relative;height:min(600px,70vh);min-height:420px}
.hero-photo .photo{position:absolute;inset:0 0 0 6%;
  -webkit-mask-image:radial-gradient(ellipse 62% 66% at 52% 44%,#000 58%,transparent 100%);
          mask-image:radial-gradient(ellipse 62% 66% at 52% 44%,#000 58%,transparent 100%)}
.photo img,.photo svg{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.note{position:absolute;top:4%;left:-5%;z-index:2;font-family:var(--hand);font-size:24px;line-height:1.05;color:#1b2238;text-align:left;transform:rotate(-6deg)}
:root[data-theme="dark"] .note{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.note svg{position:absolute;left:62px;top:74px;width:60px;height:52px;color:currentColor;opacity:.75;transform:scaleX(-1) rotate(-12deg)}

/* =============================================================
   PROJECT CARDS
   ============================================================= */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:34px}
.page-head .lead{margin-top:14px;max-width:640px;font-size:15px}
.link-accent{display:inline-flex;align-items:center;gap:8px;color:var(--accent);font-size:14px;font-weight:500;white-space:nowrap}
.link-accent:hover{text-decoration:underline}
.panel{background:var(--bg-soft);border:1px solid var(--border);border-radius:20px;padding:22px}
.grid-projects{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px 18px;transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.card-img{border-radius:10px;overflow:hidden;background:var(--bg-soft);border:1px solid var(--border);aspect-ratio:16/10;margin-bottom:18px}
.card-img>svg{width:100%;height:100%;object-fit:cover}
.card h3{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-bottom:8px;padding:0 4px}
.card p{font-size:13.5px;color:var(--muted);margin-bottom:20px;padding:0 4px;flex:1}
.card-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{white-space:nowrap;font-size:11.5px;font-weight:500;color:var(--muted);background:var(--bg-soft);border:1px solid var(--border);border-radius:6px;padding:4px 9px}
.card-arrow{padding-bottom:4px;font-size:18px;color:var(--text);transition:transform .2s,color .2s}
.card:hover .card-arrow{transform:translateX(4px);color:var(--accent)}

/* Screenshots: light/dark versions swap with the theme toggle */
.shot-dark{display:none}
:root[data-theme="dark"] .shot-light{display:none}
:root[data-theme="dark"] .shot-dark{display:block}
.card-img.has-shot,.detail-visual.has-shot{display:flex;flex-direction:column}
.frame-bar{flex:none;display:flex;align-items:center;gap:5px;height:20px;padding:0 10px;background:var(--bg-soft);border-bottom:1px solid var(--border)}
.frame-bar i{width:6px;height:6px;border-radius:50%;background:#ef4444}
.frame-bar i:nth-child(2){background:#f59e0b}.frame-bar i:nth-child(3){background:#22c55e}
.frame-media{flex:1;min-height:0;overflow:hidden;position:relative}
.frame-media .shot{width:100%;height:100%;object-fit:cover;object-position:top left}

/* SVG preview art uses these classes */
.pv-bg{fill:var(--surface)}.pv-bar{fill:var(--bg-soft)}.pv-line{fill:var(--border)}
.pv-text{fill:var(--muted);font-family:var(--font)}.pv-title{fill:var(--text);font-family:var(--font);font-weight:700}
.pv-accent{fill:var(--accent)}.pv-soft{fill:var(--accent-soft)}

/* =============================================================
   PROJECT DETAIL
   ============================================================= */
.back{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--accent);font-weight:500;margin-bottom:44px}
.back:hover{text-decoration:underline}
.detail-top{display:grid;grid-template-columns:1fr 1.05fr;gap:48px;align-items:center;margin-bottom:56px}
.detail-top .h1{margin-bottom:22px}
.detail-top .lead{font-size:16px;margin-bottom:28px}
.proj-links{display:flex;flex-wrap:wrap;gap:28px}
.proj-links a{display:inline-flex;align-items:center;gap:9px;font-size:14px;font-weight:500;color:var(--accent)}
.proj-links a:hover{text-decoration:underline}
.proj-links .icon{font-size:17px}
.detail-visual{border-radius:14px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow);background:var(--surface);aspect-ratio:16/10;position:relative}
.detail-visual.has-shot{aspect-ratio:auto;height:auto;max-height:520px;cursor:zoom-in;transition:transform .25s,box-shadow .25s}
.detail-visual.has-shot:hover{transform:translateY(-3px)}
.detail-visual.has-shot .frame-media{display:block}
.detail-visual.has-shot .shot{height:auto;max-height:500px;object-fit:cover;object-position:top}
.zoom-hint{position:absolute;right:12px;bottom:12px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:6px 11px;border-radius:999px;background:color-mix(in srgb,var(--bg) 88%,transparent);color:var(--text);border:1px solid var(--border);backdrop-filter:blur(6px);opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;pointer-events:none}
.detail-visual:hover .zoom-hint,.detail-visual:focus-visible .zoom-hint{opacity:1;transform:none}

/* Lightbox */
.lightbox{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:32px;background:rgba(8,12,24,.82);backdrop-filter:blur(6px);cursor:zoom-out;animation:pageIn .2s ease both}
.lightbox img{max-width:min(1400px,100%);max-height:100%;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.5);background:var(--surface)}
.lb-close{position:absolute;top:18px;right:20px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:24px;line-height:1}
.lb-close:hover{background:rgba(255,255,255,.26)}
.detail-visual>svg{width:100%;height:100%;object-fit:cover}

.tabs{display:flex;gap:6px 38px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:40px}
.tab{position:relative;padding:14px 0;font-size:14px;font-weight:500;color:var(--muted);transition:color .2s}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--accent);font-weight:600}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.tab-body{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:start}
.tab-body h3{font-size:24px;font-weight:700;letter-spacing:-.015em;margin-bottom:14px}
.tab-body p{color:var(--muted);font-size:15.5px;max-width:560px}
.features{background:var(--accent-soft);border:1px solid var(--border);border-radius:14px;padding:26px 30px}
.features h4{color:var(--accent);font-size:19px;font-weight:700;margin-bottom:18px}
.features li{display:flex;align-items:flex-start;gap:12px;font-size:15px;margin-bottom:12px}
.features li:last-child{margin-bottom:0}
.tick{flex:none;width:18px;height:18px;margin-top:3px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:11px}
.tick svg{stroke-width:3.4}

/* =============================================================
   EXPERIENCE
   ============================================================= */
.exp{display:grid;grid-template-columns:.8fr 1.2fr;gap:64px;align-items:start}
.exp .h1{font-size:clamp(32px,3.6vw,44px);margin-bottom:16px}
.exp .lead{font-size:15px;margin-bottom:34px}
.quote{background:var(--accent-soft);border:1px solid var(--border);border-radius:14px;padding:26px 28px;display:grid;grid-template-columns:auto 1fr;gap:14px}
.quote .mark{font-size:54px;line-height:.8;color:var(--accent);font-weight:800;font-family:Georgia,serif}
.quote p{font-size:15px;line-height:1.55}
.quote cite{display:block;margin-top:12px;font-style:normal;font-size:14px;color:var(--muted)}
.timeline{position:relative;padding-top:6px}
.t-row:not(:last-child)::before{content:"";position:absolute;left:5px;top:18px;bottom:-6px;width:2px;background:color-mix(in srgb,var(--accent) 35%,var(--border))}
.t-row{position:relative;display:grid;grid-template-columns:28px 128px 1fr minmax(0,230px);gap:0 14px;align-items:start;padding:0 0 34px;color:inherit}
.t-row:last-child{padding-bottom:0}
.t-dot{position:relative;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.t-date{font-size:13px;font-weight:600;color:var(--accent);padding-top:3px}
.t-row.no-tags .t-body{grid-column:3/5}
.t-title{font-size:14.5px;font-weight:700;line-height:1.35}
.t-sub{font-size:13px;color:var(--muted);margin-top:3px}
.t-tags{font-size:12.5px;color:var(--muted);padding-top:3px;line-height:1.5}
a.t-row:hover .t-title{color:var(--accent)}

/* =============================================================
   ABOUT
   ============================================================= */
.about{display:grid;grid-template-columns:1.15fr .72fr .85fr;gap:44px;align-items:center}
.about .h1{font-size:clamp(34px,3.8vw,48px);margin-bottom:22px}
.about p.lead{font-size:15px;margin-bottom:30px;max-width:520px}
.about-photo{border-radius:14px;overflow:hidden;aspect-ratio:3/4.4;background:var(--bg-soft);border:1px solid var(--border)}
.about-photo img,.about-photo svg{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.facts li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;padding:18px 0;border-bottom:1px solid var(--border)}
.facts li:first-child{padding-top:0}
.facts li:last-child{border-bottom:0;padding-bottom:0}
.fact-ico{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:19px}
.fact-label{font-size:14px;font-weight:700}
.fact-value{font-size:13px;color:var(--muted);line-height:1.5;white-space:pre-line}

/* =============================================================
   CONTACT
   ============================================================= */
.contact{padding-top:36px}
.contact .h1{font-size:clamp(34px,4vw,48px);margin-bottom:20px;max-width:560px}
.contact .lead{font-size:15px;margin-bottom:40px;max-width:560px}
.contact-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.c-card{display:flex;align-items:center;gap:16px;padding:20px 22px;border:1px solid var(--border);border-radius:12px;background:var(--surface);transition:border-color .2s,box-shadow .2s;min-width:0}
.c-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.c-card .c-ico{font-size:30px;color:var(--accent);flex:none}
.c-card b{display:block;font-size:14px;font-weight:600;overflow-wrap:anywhere;line-height:1.35}
.c-card span{font-size:13px;color:var(--muted)}

/* =============================================================
   FOOTER
   ============================================================= */
.footer{border-top:1px solid var(--border);margin-top:20px}
.footer-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-top:26px;padding-bottom:30px;font-size:13px;color:var(--muted)}
.footer nav{display:flex;gap:30px}
.footer nav a:hover{color:var(--accent)}

/* =============================================================
   RESPONSIVE
   ============================================================= */
@media (max-width:1020px){
  .grid-projects{grid-template-columns:repeat(2,1fr)}
  .about{grid-template-columns:1fr 1fr;gap:36px}
  .about .facts{grid-column:1/-1}
  .contact-cards{grid-template-columns:1fr}
  .exp{grid-template-columns:1fr;gap:44px}
}
@media (max-width:820px){
  .container{padding:0 22px}
  .nav-inner{grid-template-columns:auto 1fr;height:66px}
  .burger{display:grid}
  .nav-links{position:absolute;top:66px;left:0;right:0;flex-direction:column;gap:0;background:var(--bg);border-bottom:1px solid var(--border);padding:8px 22px 16px;display:none}
  .nav.open .nav-links{display:flex}
  .nav-links a{padding:14px 0}
  .nav-links a.active::after{bottom:8px;right:auto;width:28px}
  .hero{grid-template-columns:1fr;min-height:0;gap:8px}
  .hero-photo{order:-1;height:380px;min-height:0}
  .hero-photo .photo{inset:0 14% 0 14%}
  .note{font-size:21px}
  .page-head{flex-direction:column;align-items:flex-start}
  .detail-top{grid-template-columns:1fr;gap:32px}
  .tab-body{grid-template-columns:1fr;gap:30px}
  .tabs{gap:4px 24px;overflow-x:auto;flex-wrap:nowrap}
  .tab{white-space:nowrap}
  .t-row{grid-template-columns:24px 1fr;gap:2px 12px;padding-bottom:28px}
  .t-date{grid-column:2}.t-body,.t-row.no-tags .t-body{grid-column:2}.t-tags{grid-column:2;padding-top:4px}
  .t-dot{grid-row:1/4}
  .about{grid-template-columns:1fr}
  .about-photo{max-width:340px}
}
@media (max-width:560px){
  .grid-projects{grid-template-columns:1fr}
  .panel{padding:14px}
  .hero-btns .btn{flex:1 1 100%}
  .footer nav{gap:20px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>

<script>
/* =====================================================================
   RENDERING LOGIC  — you shouldn't need to edit below to change content.
   ===================================================================== */

/* ---------- helpers ---------- */
const $  = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
// *word* -> accent colour, \n -> line break
const hl  = s => esc(s).replace(/\*(.+?)\*/g, '<span class="accent">$1</span>').replace(/\n/g, "<br>");

/* ---------- icons ---------- */
const STROKE = {
  arrow:    '<path d="M5 12h14M13 6l6 6-6 6"/>',
  back:     '<path d="M19 12H5M11 6l-6 6 6 6"/>',
  download: '<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>',
  sun:      '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:     '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  external: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  check:    '<path d="M5 12l5 5 9-10"/>',
  mail:     '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  code:     '<path d="M8 8l-4 4 4 4M16 8l4 4-4 4"/>',
  report:   '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',

const hasShot = p => !!(p.image || p.imageLight || p.imageDark);
// light + dark screenshots: CSS shows the one that matches the current theme
function shot(p){
  const light = p.imageLight || p.image, dark = p.imageDark || p.image;
  const img = (src, cls) => `<img class="shot ${cls}" src="${esc(src)}" alt="${esc(p.title)} screenshot" loading="lazy">`;
  return light === dark ? img(light, "") : img(light, "shot-light") + img(dark, "shot-dark");
}
const frame = inner => `<div class="frame-bar" aria-hidden="true"><i></i><i></i><i></i></div><div class="frame-media">${inner}</div>`;
const visual = p => hasShot(p) ? frame(shot(p)) : (PREVIEWS[p.preview] || PREVIEWS.vision)(p.title);

    <div class="card-img${hasShot(p) ? " has-shot" : ""}">${visual(p)}</div>

    <div class="card-foot">
      <div class="chips">${cardTags(p.tags || [])}</div>
      <span class="card-arrow">${icon("arrow")}</span>
    </div>
  </a>`;

const cardTags = tags => {
  const shown = tags.length > 3 ? tags.slice(0, 2) : tags;
  const more = tags.length - shown.length;
  return shown.map(t => `<span class="chip">${esc(t)}</span>`).join("") + (more > 0 ? `<span class="chip">+${more}</span>` : "");
};
const ticks = list => list.map(i => `<li><span class="tick">${icon("check")}</span><span>${esc(i)}</span></li>`).join("");

function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  const page = parts[0] || "home";
  let html, active = page, title = "";
  if (page === "projects" && parts[1]) {
    html = pages.project(parts[1]);
    const p = SITE.projects.find(x => x.id === parts[1]);
    title = p ? p.title : "Projects";
  } else if (pages[page]) {
    html = pages[page]();
    title = page === "home" ? "" : page[0].toUpperCase() + page.slice(1);
  } else { html = pages.home(); active = "home"; }

  $("#app").innerHTML = `<div class="page">${html}</div>`;
  document.title = title ? `${title} — ${SITE.name}` : SITE.pageTitle;
  document.querySelectorAll(".nav-links a").forEach(a => {
    const on = a.dataset.page === active;
    a.classList.toggle("active", on);
    on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current");
  });
  $("#nav").classList.remove("open");
  window.scrollTo(0, 0);
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) {                                   // project detail tabs
    const id = tab.closest("[data-project]").dataset.project;
    const p = SITE.projects.find(x => x.id === id);
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b === tab));
    $("#tabBody").innerHTML = tabBody(p.tabs[+tab.dataset.tab]);
    return;
  }
  if (e.target.closest("[data-zoom]")) { openLightbox(e.target.closest("[data-project]").dataset.project); return; }
  if (e.target.closest("#lightbox")) { closeLightbox(); return; }
  if (e.target.closest("#themeBtn")) {
    setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  }
  if (e.target.closest("#burger")) {
    const open = $("#nav").classList.toggle("open");
    $("#burger").setAttribute("aria-expanded", open);
  }
});
window.addEventListener("scroll", () => $("#nav").classList.toggle("scrolled", scrollY > 8), { passive: true });
window.addEventListener("hashchange", () => { closeLightbox(); route(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeLightbox();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-zoom]")) { e.preventDefault(); e.target.click(); }
});
function openLightbox(id){
  const p = SITE.projects.find(x => x.id === id); if (!p || !hasShot(p)) return;
  closeLightbox();
  document.body.insertAdjacentHTML("beforeend", `<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="${esc(p.title)} screenshot">${shot(p)}<button class="lb-close" aria-label="Close">×</button></div>`);
  document.body.style.overflow = "hidden";
}
function closeLightbox(){ const l = $("#lightbox"); if (l) { l.remove(); document.body.style.overflow = ""; } }

/* ---------- start ---------- */
renderHeader();
renderFooter();
let saved = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
try { saved = localStorage.getItem("theme") || saved; } catch (e) {}
setTheme(saved);
route();
</script>
</body>
</html>
